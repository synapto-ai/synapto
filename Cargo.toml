[workspace]
resolver = "2"

members = [
    "crates/*",
    "integrations/plugins/*",
    "integrations/storage-providers/*",
    "integrations/prompt-providers/*",
    "integrations/datadir-providers/*",
    "integrations/synapto-battery-pack",
]

[workspace.package]
version = "0.1.0-dev.8"
license = "MPL-2.0"
repository = "https://github.com/synapto-ai/synapto"

[workspace.dependencies]
synapto = { path = "crates/core", version = "0.1.0-dev.8" }
synapto-derive = { path = "crates/derive", version = "0.1.0-dev.8" }
synapto-interface = { path = "crates/interface", version = "0.1.0-dev.8" }
synapto-telemetry = { path = "crates/telemetry", version = "0.1.0-dev.8" }
synapto-llm = { path = "crates/llm", version = "0.1.0-dev.8" }
synapto-shutdown = { path = "crates/shutdown", version = "0.1.0-dev.8" }
synapto-test = { path = "crates/test", version = "0.1.0-dev.8" }

schemars = "1.2"
serde = { version = "1", default-features = false, features = [
    "derive",
    "alloc",
] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
tokio = { version = "1", features = ["macros", "signal", "rt", "rt-multi-thread", "net", "time", "process", "io-util"] }
better_tokio_select = "0.2.0"
bytes = "1"
derive_more= {version = "2", features=["full"]}
async-trait= "0.1"
tracing = "0.1"
url = "2"
serde_yaml = "0.9"

[workspace.lints.rust]
unsafe_code = "deny"
unreachable_pub = "warn"

[workspace.lints.clippy]
let_underscore_must_use = "deny"
unwrap_used = "deny"
disallowed_methods = "deny"
disallowed_macros = "deny"
todo = "warn"
