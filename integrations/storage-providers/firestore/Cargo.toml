[package]
name = "synapto-storage-firestore"
description = "Google Cloud Firestore storage provider for the Synapto framework"
version = "0.1.0-dev.12"
edition = "2024"
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
synapto-interface.workspace = true
synapto-credentials-google.workspace = true
gcloud-sdk = "0.25"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["sync", "rt"] }
tracing.workspace = true
firestore = "0.43"
uuid = { version = "1", features = ["v4"] }
tokio-stream = "0.1"

[dev-dependencies]
synapto-test.workspace = true
synapto.workspace = true

