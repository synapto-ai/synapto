[package]
name = "synapto-plugin-tts-google"
description = "Google Cloud text-to-speech plugin for the Synapto framework"
version = "0.1.0-dev.7"
edition = "2024"
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
synapto-interface.workspace = true
synapto-credentials-google.workspace = true
async-trait.workspace = true
serde.workspace = true
tokio = { workspace = true, features = ["sync", "time", "rt", "macros"] }
tracing.workspace = true
reqwest = { version = "0.12", features = ["json"] }
data-encoding = "2"
unicode-segmentation = "1"
serde_json.workspace = true

[dev-dependencies]
synapto-test.workspace = true
synapto.workspace = true
